---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: vero
  labels:
    name: vero

---
# ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: vero-config
  namespace: vero
data:
  VERO_PORT: "8000"
  VERO_DB: "/app/data/vero.db"

---
# Secret (需要手动创建 API keys; MSF 密码必填, 不再放占位值)
apiVersion: v1
kind: Secret
metadata:
  name: vero-secrets
  namespace: vero
type: Opaque
stringData:
  ANTHROPIC_API_KEY: ""  # 填入实际 key
  DEEPSEEK_API_KEY: ""   # 填入实际 key
  MSF_PASSWORD: ""       # 填入实际密码(勿用默认值; 缺失时 msf 工具明确报错而非弱口令)

---
# PersistentVolumeClaim - 数据持久化
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vero-data
  namespace: vero
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard

---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vero
  namespace: vero
  labels:
    app: vero
spec:
  replicas: 1  # 单实例 (SQLite 限制)
  selector:
    matchLabels:
      app: vero
  strategy:
    type: Recreate  # 避免多实例同时访问 SQLite
  template:
    metadata:
      labels:
        app: vero
    spec:
      serviceAccountName: vero  # 绑定最小权限 SA(修原版定义了 SA 却未挂载, Pod 走默认 SA)
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: vero
        image: vero:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: VERO_PORT
          valueFrom:
            configMapKeyRef:
              name: vero-config
              key: VERO_PORT
        - name: VERO_DB
          valueFrom:
            configMapKeyRef:
              name: vero-config
              key: VERO_DB
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: vero-secrets
              key: ANTHROPIC_API_KEY
              optional: true
        - name: DEEPSEEK_API_KEY
          valueFrom:
            secretKeyRef:
              name: vero-secrets
              key: DEEPSEEK_API_KEY
              optional: true
        - name: VERO_MSF_PASSWORD
          valueFrom:
            secretKeyRef:
              name: vero-secrets
              key: MSF_PASSWORD
              optional: true
        volumeMounts:
        - name: data
          mountPath: /app/data
        - name: wordlists
          mountPath: /app/wordlists
          readOnly: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: vero-data
      - name: wordlists
        configMap:
          name: vero-wordlists
          optional: true

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: vero
  namespace: vero
  labels:
    app: vero
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: vero

---
# Ingress (可选 - 需要 Ingress Controller)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vero
  namespace: vero
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"  # 如果使用 cert-manager
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - vero.example.com
    secretName: vero-tls
  rules:
  - host: vero.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: vero
            port:
              number: 8000

---
# NetworkPolicy - 限制网络访问
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vero-netpol
  namespace: vero
spec:
  podSelector:
    matchLabels:
      app: vero
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx  # 只允许 Ingress Controller
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 53  # DNS
    - protocol: UDP
      port: 53
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 55553  # Metasploit RPC (如果部署)
  # 仅允许出网到 LLM API 与目标系统; 明确封死云元数据地址(169.254.169.254),
  # 修原版 `- to: []` 全放行且无元数据防护。
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 169.254.169.254/32
        - 169.254.170.2/32

---
# ServiceAccount (最小权限)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vero
  namespace: vero

---
# Role (如果需要访问 K8s API)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vero-role
  namespace: vero
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list"]

---
# RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vero-rolebinding
  namespace: vero
subjects:
- kind: ServiceAccount
  name: vero
  namespace: vero
roleRef:
  kind: Role
  name: vero-role
  apiGroup: rbac.authorization.k8s.io
