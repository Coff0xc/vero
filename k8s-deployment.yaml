---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: redcell
  labels:
    name: redcell

---
# ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: redcell-config
  namespace: redcell
data:
  REDCELL_PORT: "8000"
  REDCELL_DB: "/app/data/redcell.db"

---
# Secret (需要手动创建 API keys)
apiVersion: v1
kind: Secret
metadata:
  name: redcell-secrets
  namespace: redcell
type: Opaque
stringData:
  ANTHROPIC_API_KEY: ""  # 填入实际 key
  DEEPSEEK_API_KEY: ""   # 填入实际 key
  MSF_PASSWORD: "change-me-in-production"

---
# PersistentVolumeClaim - 数据持久化
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redcell-data
  namespace: redcell
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard

---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redcell
  namespace: redcell
  labels:
    app: redcell
spec:
  replicas: 1  # 单实例 (SQLite 限制)
  selector:
    matchLabels:
      app: redcell
  strategy:
    type: Recreate  # 避免多实例同时访问 SQLite
  template:
    metadata:
      labels:
        app: redcell
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: redcell
        image: redcell:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: REDCELL_PORT
          valueFrom:
            configMapKeyRef:
              name: redcell-config
              key: REDCELL_PORT
        - name: REDCELL_DB
          valueFrom:
            configMapKeyRef:
              name: redcell-config
              key: REDCELL_DB
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: redcell-secrets
              key: ANTHROPIC_API_KEY
              optional: true
        - name: DEEPSEEK_API_KEY
          valueFrom:
            secretKeyRef:
              name: redcell-secrets
              key: DEEPSEEK_API_KEY
              optional: true
        volumeMounts:
        - name: data
          mountPath: /app/data
        - name: wordlists
          mountPath: /app/wordlists
          readOnly: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: redcell-data
      - name: wordlists
        configMap:
          name: redcell-wordlists
          optional: true

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: redcell
  namespace: redcell
  labels:
    app: redcell
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: redcell

---
# Ingress (可选 - 需要 Ingress Controller)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: redcell
  namespace: redcell
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"  # 如果使用 cert-manager
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - redcell.example.com
    secretName: redcell-tls
  rules:
  - host: redcell.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: redcell
            port:
              number: 8000

---
# NetworkPolicy - 限制网络访问
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redcell-netpol
  namespace: redcell
spec:
  podSelector:
    matchLabels:
      app: redcell
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx  # 只允许 Ingress Controller
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 53  # DNS
    - protocol: UDP
      port: 53
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 55553  # Metasploit RPC (如果部署)
  - to: []  # 允许访问外部 (LLM API, 目标系统)

---
# ServiceAccount (最小权限)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redcell
  namespace: redcell

---
# Role (如果需要访问 K8s API)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: redcell-role
  namespace: redcell
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list"]

---
# RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: redcell-rolebinding
  namespace: redcell
subjects:
- kind: ServiceAccount
  name: redcell
  namespace: redcell
roleRef:
  kind: Role
  name: redcell-role
  apiGroup: rbac.authorization.k8s.io
