name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    name: Go vet/build/test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./cmd/... ./internal/...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./cmd/... ./internal/...

  web:
    name: Web build (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
